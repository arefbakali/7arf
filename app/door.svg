<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-label="Porte bleue de Sidi Bou Saïd, illustration minimaliste">
<!-- Illustration originale du projet 7arf (formes géométriques simples) : mur blanchi à la chaux, porte bleue cintrée, clous en arc. -->
<defs>
<linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2468AE"/><stop offset="1" stop-color="#1A5594"/></linearGradient>
</defs>
<!-- encadrement de chaux -->
<path d="M14 744V276a246 246 0 0 1 492 0v468z" fill="#FFFFFF" stroke="#D5DFDE" stroke-width="3"/>
<!-- porte -->
<path d="M50 744V276a210 210 0 0 1 420 0v468z" fill="url(#d)"/>
<!-- filet intérieur et séparation des deux battants -->
<path d="M72 744V276a188 188 0 0 1 376 0v468" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>
<path d="M260 280V744" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>
<!-- imposte : demi-cercle et rayons -->
<path d="M110 276a150 150 0 0 1 300 0z" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="3"/>
<g stroke="#FFFFFF" stroke-opacity=".8" stroke-width="3">
<path d="M260 276V126"/><path d="M260 276L154 170"/><path d="M260 276L366 170"/>
</g>
<!-- clous en arc -->
<g fill="#FFFFFF">
<circle cx="61" cy="340" r="5"/><circle cx="61" cy="276" r="5"/><circle cx="68" cy="224" r="5"/><circle cx="88" cy="176" r="5"/><circle cx="119" cy="135" r="5"/><circle cx="160" cy="104" r="5"/><circle cx="208" cy="84" r="5"/><circle cx="260" cy="77" r="5"/><circle cx="312" cy="84" r="5"/><circle cx="359" cy="104" r="5"/><circle cx="401" cy="135" r="5"/><circle cx="432" cy="176" r="5"/><circle cx="452" cy="224" r="5"/><circle cx="459" cy="276" r="5"/><circle cx="459" cy="340" r="5"/>
</g>
<!-- un losange par battant, en bas -->
<g fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="3">
<path d="M166 600l40 46-40 46-40-46z"/><path d="M354 600l40 46-40 46-40-46z"/>
</g>
<g fill="#FFFFFF"><circle cx="166" cy="646" r="5"/><circle cx="354" cy="646" r="5"/></g>
<!-- heurtoirs -->
<g fill="none" stroke="#FFFFFF" stroke-width="3"><circle cx="240" cy="560" r="9"/><circle cx="280" cy="560" r="9"/></g>
<!-- seuil -->
<rect x="0" y="742" width="520" height="18" rx="3" fill="#FFFFFF" stroke="#D5DFDE" stroke-width="2"/>
</svg>
